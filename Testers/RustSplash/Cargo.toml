[package]
name = "fast_splash"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.27", features = ["glow"] }
tokio = { version = "1.0", features = ["rt", "macros", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zmq = "0.10.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
] }

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable link-time optimization
codegen-units = 1   # Reduce parallel code generation units to improve optimization
panic = "abort"     # Remove panic unwinding to reduce binary size
strip = true        # Automatically strip symbols from the binary
